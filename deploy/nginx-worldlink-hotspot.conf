# Add as a NEW Nginx site; do not overwrite WorldLink's existing Nginx sites.
# Obtain a valid certificate with certbot --nginx, then use Cloudflare Full (strict).
server {
    listen 80;
    listen [::]:80;
    server_name wifi.worldlinksecurity.co.tz;

    client_max_body_size 8m;

    location /static/ {
        alias /var/www/worldlink-hotspot-cloud/staticfiles/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location /media/ {
        alias /var/lib/worldlink-hotspot-cloud/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
