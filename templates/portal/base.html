{% load static %}
<!doctype html>
<html lang="{{ lang }}" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="{{ portal.accent_color }}">
  <meta name="referrer" content="same-origin">
  <title>{{ company.name }} · {{ w.guest_wifi }}</title>
  {% if company.logo %}<link rel="icon" type="image/png" href="{{ company.logo.url }}">{% else %}<link rel="icon" href="{% static 'img/worldlink-hotspot-32.png' %}" type="image/png">{% endif %}
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v={{ app_css_version }}">
  <style>
    :root { --portal-accent: {{ portal.accent_color }}; }
    /* Captive browsers can load HTML before their hotspot grants CSS access.
       Keep the guest page fitted to the device even on that first response. */
    @media (max-width:760px) {
      html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
      body.guest-body { margin:0; width:100%; min-width:0; overflow-x:clip; background:#faf7ef; color:#263b47; font:13px/1.55 system-ui,-apple-system,Segoe UI,sans-serif; }
      .guest-body *, .guest-body *::before, .guest-body *::after { box-sizing:border-box; }
      .guest-shell { box-sizing:border-box; width:100%; max-width:100%; min-width:0; padding:0 15px; margin:0 auto; }
      .guest-header { display:flex; align-items:center; justify-content:space-between; gap:10px; min-width:0; min-height:76px; }
      .guest-brand { display:flex; align-items:center; gap:9px; min-width:0; }
      .guest-logo { display:grid; place-items:center; width:40px; height:40px; flex:0 0 40px; overflow:hidden; border-radius:10px; }
      .guest-logo img { display:block; width:100%; height:100%; object-fit:contain; }
      .guest-logo svg { display:block; width:24px; height:24px; }
      .guest-plan-icon svg { display:block; width:23px; height:23px; }
      .guest-brand-copy { display:flex; flex-direction:column; min-width:0; }
      .guest-brand-copy strong { display:block; max-width:200px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:13px; }
      .guest-brand-copy small { font-size:11px; }
      .guest-language { flex:0 0 auto; display:flex; }
      .guest-language a { display:grid; place-items:center; min-width:42px; min-height:42px; }
      .guest-main,.guest-hero,.guest-bottom-grid,.guest-plan-grid,.guest-plan,.guest-info,.guest-voucher-content { min-width:0; max-width:100%; }
      .guest-plan-grid,.guest-bottom-grid { display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }
      .guest-main { padding:28px 0 34px; }
      .guest-hero { text-align:center; margin:0 auto 25px; }
      .guest-hero h1 { font-size:clamp(22px,6vw,27px); line-height:1.25; }
      .guest-plan,.guest-info { width:100%; padding:17px; border:1px solid #e1e3df; border-radius:12px; background:#fffefa; }
      .guest-info { display:flex; align-items:flex-start; gap:12px; }
      .guest-plan-specs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .guest-primary { display:block; text-align:center; padding:12px; border-radius:8px; background:var(--portal-accent,#13788a); color:#fff; text-decoration:none; }
      .guest-form,.guest-voucher-form { min-width:0; max-width:100%; }
      .guest-voucher-form { display:grid; grid-template-columns:minmax(0,1fr); gap:8px; }
      .guest-body :is(input:not([type="hidden"]),select,textarea) { font-size:16px!important; max-width:100%; }
    }
  </style>
</head>
<body class="guest-body">
  <div class="guest-topline"></div>
  <div class="guest-shell">
    <header class="guest-header">
      <a class="guest-brand" href="{% url 'portal:public' company.slug %}?lang={{ lang }}">
        <span class="guest-logo">{% if company.logo %}<img src="{{ company.logo.url }}" alt="{{ company.name }} logo">{% else %}<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 9c5-4 13-4 18 0M6 13c3.5-3 8.5-3 12 0M9.3 17a4 4 0 0 1 5.4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="20" r="1.4" fill="currentColor"/></svg>{% endif %}</span>
        <span class="guest-brand-copy"><strong>{{ company.name }}</strong><small>{{ w.guest_wifi }}</small></span>
      </a>
      <div class="guest-language" aria-label="Language"><a href="?lang=en" {% if lang == 'en' %}class="active" aria-current="true"{% endif %}>EN</a><a href="?lang=sw" {% if lang == 'sw' %}class="active" aria-current="true"{% endif %}>SW</a></div>
    </header>
    <main class="guest-main">{% block guest_content %}{% endblock %}</main>
    <footer class="guest-footer">
      <span>{{ company.name }}</span>
      <span>{{ w.secure }}</span>
    </footer>
  </div>
  <script defer src="{% static 'js/progress.js' %}?v={{ app_js_version }}"></script>
  <script defer src="{% static 'js/portal_expiry.js' %}?v={{ app_js_version }}"></script>
</body>
</html>
