{% load static %}
<!doctype html>
<html lang="{{ lang }}" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="{{ portal.accent_color }}">
  <meta name="referrer" content="no-referrer">
  <title>{{ company.name }} · Guest Wi-Fi</title>
  {% if company.logo %}<link rel="icon" type="image/png" href="{{ company.logo.url }}">{% else %}<link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">{% endif %}
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=7">
  <style>:root { --portal-accent: {{ portal.accent_color }}; }</style>
</head>
<body class="guest-body">
  <div class="guest-topline"></div>
  <div class="guest-shell">
    <header class="guest-header">
      <a class="guest-brand" href="{% url 'portal:public' company.slug %}?lang={{ lang }}">
        <span class="guest-logo">{% if company.logo %}<img src="{{ company.logo.url }}" alt="{{ company.name }} logo">{% else %}<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 9c5-4 13-4 18 0M6 13c3.5-3 8.5-3 12 0M9.3 17a4 4 0 0 1 5.4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="20" r="1.4" fill="currentColor"/></svg>{% endif %}</span>
        <span class="guest-brand-copy"><strong>{{ company.name }}</strong><small>Guest Wi-Fi</small></span>
      </a>
      <div class="guest-language" aria-label="Language"><a href="?lang=en" {% if lang == 'en' %}class="active" aria-current="true"{% endif %}>EN</a><a href="?lang=sw" {% if lang == 'sw' %}class="active" aria-current="true"{% endif %}>SW</a></div>
    </header>
    <main class="guest-main">{% block guest_content %}{% endblock %}</main>
    <footer class="guest-footer">
      <span>{{ company.name }}</span>
      <span>{{ w.secure }}</span>
    </footer>
  </div>
</body>
</html>
