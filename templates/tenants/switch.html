{% extends 'base.html' %}{% load translations %}{% block content %}<div class="page-heading"><div><h1>{% t 'Switch business' %}</h1></div></div><div class="panel narrow-panel"><form method="post" class="stack-form">{% csrf_token %}<label for="company_id">{% t 'Choose a business' %}</label><select id="company_id" name="company_id" class="input" required>{% for m in memberships %}<option value="{{ m.company_id }}" {% if active_company.pk == m.company_id %}selected{% endif %}>{{ m.company.name }} ({{ m.get_role_display }})</option>{% endfor %}</select><button class="button button-primary" type="submit">{% t 'Switch' %}</button></form></div>{% endblock %}
